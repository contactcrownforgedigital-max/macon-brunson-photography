<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video — Macon Brunson Photography</title>

<style>
:root{
  --bg:#0a0a0c;
  --line:rgba(255,255,255,.12);
  --radius:20px;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
a{text-decoration:none;color:inherit}
.container{width:min(1100px, calc(100% - 40px));margin:auto}

/* NAV */
.nav{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  z-index:100;
}
.nav-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 0;
}
.brand{
  text-transform:uppercase;
  font-weight:700;
  letter-spacing:.2em;
  font-size:12px;
}
.navlinks{
  display:flex;
  gap:18px;
}
.navlinks a{
  font-size:13px;
  color:#aaa;
}
.navlinks a:hover{
  color:#fff;
}

/* HEADER */
header{
  padding:110px 0 40px;
  text-align:center;
}
header h1{
  margin:0;
  font-size:34px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:24px;
  padding:20px 0 80px;
}

.card{
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  background:#000;
  transition:transform .3s ease;
}

.card:hover{
  transform:translateY(-4px);
}

video{
  width:100%;
  display:block;
  background:#000;
}

footer{
  text-align:center;
  padding:40px 0;
  border-top:1px solid var(--line);
  color:#777;
  font-size:13px;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="nav">
  <div class="container nav-inner">
    <div class="brand">MACON BRUNSON PHOTOGRAPHY</div>
    <div class="navlinks">
      <a href="./index.html">Home</a>
      <a href="./gallery.html">Gallery</a>
      <a href="./videos.html">Video</a>
    </div>
  </div>
</div>

<header class="container">
  <h1>Video</h1>
</header>

<main class="container">
  <div class="grid">

    <div class="card">
      <video controls playsinline preload="metadata">
        <source src="assets/videos/v1.mp4" type="video/mp4">
      </video>
    </div>

    <div class="card">
      <video controls playsinline preload="metadata">
        <source src="assets/videos/v2.mp4" type="video/mp4">
      </video>
    </div>

    <div class="card">
      <video controls playsinline preload="metadata">
        <source src="assets/videos/v3.mp4" type="video/mp4">
      </video>
    </div>

    <div class="card">
      <video controls playsinline preload="metadata">
        <source src="assets/videos/v4.mp4" type="video/mp4">
      </video>
    </div>

    <div class="card">
      <video controls playsinline preload="metadata">
        <source src="assets/videos/v5.mp4" type="video/mp4">
      </video>
    </div>

  </div>
</main>

<footer>
  © <span id="year"></span> Macon Brunson Photography
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
